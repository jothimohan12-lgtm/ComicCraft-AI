<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Export Complete
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>

<main class="container narrow">

    <section class="card success">

        <p class="eyebrow">
            EXPORT COMPLETE
        </p>


        <h1>
            Your comic is ready.
        </h1>


        <p>
            The PDF has been generated successfully.
        </p>


        {% if pdf_url %}

        <a
            class="button"
            href="{{ pdf_url }}"
            download
        >
            Download PDF Again
        </a>

        {% endif %}


        <a
            class="button secondary"
            href="/"
        >
            Go Create Another Comic
        </a>

    </section>

</main>

</body>

</html>
